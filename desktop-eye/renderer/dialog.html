<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桌面截图 — 发送截图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
	width: 100%;
	height: 100%;
	font-family: 'Noto Sans SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
	background: #f8f6f1;
	color: #26241f;
	overflow: hidden;
}

.container {
	display: flex;
	flex-direction: column;
	height: 100%;
	padding: 18px;
	border: 1px solid #ded8cb;
	border-radius: 14px;
}

/* 标题栏（可拖动） */
.title-bar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 2px;
	-webkit-app-region: drag;
	cursor: move;
}

.title-bar h3 {
	font-size: 17px;
	font-weight: 700;
	color: #29261f;
	margin: 0;
}

.close-btn {
	-webkit-app-region: no-drag;
	width: 28px;
	height: 28px;
	border: none;
	background: transparent;
	color: #999;
	font-size: 18px;
	cursor: pointer;
	border-radius: 4px;
	display: flex;
	align-items: center;
	justify-content: center;
	transition: all 0.2s;
}
.close-btn:hover {
	background: rgba(255,80,80,0.15);
	color: #e74c3c;
}

/* 提示文字 */
.hint {
	color: #777168;
	font-size: 12px;
	line-height: 1.5;
	margin-bottom: 10px;
}

/* 截图预览区 */
.preview-area {
	flex: 1;
	min-height: 0;
	background: #ece9e2;
	border: 1px solid #d9d3c7;
	border-radius: 12px;
	overflow: hidden;
	display: flex;
	align-items: center;
	justify-content: center;
}

.preview-area img {
	max-width: 100%;
	max-height: 100%;
	object-fit: contain;
}

/* 信息区 */
.info-area {
	background: transparent;
	border: none;
	border-radius: 0;
	padding: 7px 2px 0;
	margin-top: 10px;
	font-size: 12px;
	color: #777168;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

/* 消息输入 */
.message-area {
	margin-top: 12px;
}

.message-area textarea {
	width: 100%;
	height: 76px;
	padding: 11px 12px;
	border: 1px solid #cfc8ba;
	border-radius: 10px;
	font-size: 14px;
	font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
	background: #fffefa;
	color: #26241f;
	resize: none;
	outline: none;
	transition: border-color 0.2s, box-shadow 0.2s;
}

.message-area textarea:focus {
	border-color: #c69008;
	box-shadow: 0 0 0 3px rgba(198, 144, 8, 0.13);
}

.message-area textarea::placeholder {
	color: #aaa;
}

/* 按钮区 — 三按钮 */
.btn-row {
	display: flex;
	gap: 8px;
	margin-top: 12px;
}

.btn {
	flex: 1;
	min-height: 42px;
	padding: 9px 13px;
	border: 1px solid transparent;
	border-radius: 10px;
	font-size: 13px;
	font-weight: 650;
	font-family: inherit;
	cursor: pointer;
	transition: transform 0.2s ease, opacity 0.2s ease;
}
.btn:hover:not(:disabled) {
	transform: translateY(-1px);
}
.btn:active {
	transform: translateY(0);
}

.btn-cancel {
	background: transparent;
	border-color: #d8d2c7;
	color: #6f6a61;
}
.btn-cancel:hover {
	background: #efede8;
	color: #39362f;
}

.btn-secondary {
	background: #f3ead2;
	border-color: #e1c982;
	color: #725810;
}
.btn-secondary:hover {
	background: #ede0bd;
	color: #4f3c09;
}

.btn-primary {
	background: #c9960a;
	color: #fff;
}
.btn-primary:hover {
	background: #b88706;
	box-shadow: 0 3px 10px rgba(167, 120, 0, 0.22);
}

.btn:disabled { opacity: 0.55; cursor: wait; transform: none; }
.btn-mic { flex: 0 0 44px; padding: 0; font-size: 16px; }

/* Toast 通知 */
.toast {
	position: fixed;
	bottom: 16px;
	left: 50%;
	transform: translateX(-50%);
	padding: 8px 18px;
	background: rgba(212, 160, 23, 0.9);
	color: #fff;
	border-radius: 8px;
	font-size: 13px;
	opacity: 0;
	transition: opacity 0.3s ease;
	pointer-events: none;
	text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
	box-shadow: 0 4px 12px rgba(212, 160, 23, 0.3);
	z-index: 100;
}
.toast.visible { opacity: 1; }
</style>
</head>
<body>
<div class="container">
	<!-- 标题栏 -->
	<div class="title-bar">
		<h3>分享截图给 AI</h3>
		<button class="close-btn" id="btn-close">×</button>
	</div>

	<!-- 提示 -->
	<p class="hint" id="hint-text">输入一句说明，或直接把截图作为一条视觉消息发送。</p>

	<!-- 截图预览 -->
	<div class="preview-area">
		<img id="preview-img" alt="截图预览">
	</div>

	<!-- 信息区 -->
	<div class="info-area" id="info-area">桌面截图 · 正在读取…</div>

	<!-- 输入框 -->
	<div class="message-area">
		<textarea id="message-input" placeholder="想对 AI 说什么？&#10;（留空则仅分享截图）"></textarea>
	</div>

	<!-- 按钮区:🎤语音输入(凛倾 0722) + 取消/仅分享/发送 -->
	<div class="btn-row">
		<button class="btn btn-secondary btn-mic" id="btn-mic" title="语音转文字（需 STT 服务运行）">🎤</button>
		<button class="btn btn-cancel" id="btn-cancel">取消</button>
		<button class="btn btn-secondary" id="btn-passive">直接发图</button>
		<button class="btn btn-primary" id="btn-send">发送</button>
	</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(() => {
	const previewImg = document.getElementById('preview-img')
	const messageInput = document.getElementById('message-input')
	const hintText = document.getElementById('hint-text')
	const infoArea = document.getElementById('info-area')
	const btnSend = document.getElementById('btn-send')
	const btnPassive = document.getElementById('btn-passive')
	const btnCancel = document.getElementById('btn-cancel')
	const btnClose = document.getElementById('btn-close')
	const toastEl = document.getElementById('toast')
	const btnMic = document.getElementById('btn-mic')

	let imageDataUrl = null
	let sending = false

	function setSending(on) {
		sending = !!on
		for (const btn of [btnSend, btnPassive, btnCancel, btnMic]) if (btn) btn.disabled = sending
	}

	// Toast 通知
	function showToast(msg, duration = 2000) {
		toastEl.textContent = msg
		toastEl.classList.add('visible')
		clearTimeout(toastEl._timer)
		toastEl._timer = setTimeout(() => toastEl.classList.remove('visible'), duration)
	}

	// 接收主进程传来的截图预览
	window.desktopEye.onSetPreview((dataUrl) => {
		imageDataUrl = dataUrl

		// 显示真实编码、像素和估算字节，让压缩状态可见而不是藏在日志里。
		const now = new Date()
		const timeStr = now.toLocaleString('zh-CN', {
			year: 'numeric', month: '2-digit', day: '2-digit',
			hour: '2-digit', minute: '2-digit'
		})
		const base64 = String(dataUrl).split(',')[1] || ''
		const kb = Math.max(1, Math.round(base64.length * 3 / 4 / 1024))
		previewImg.onload = () => {
			infoArea.textContent = `JPEG · ${previewImg.naturalWidth}×${previewImg.naturalHeight} · ${kb} KB · ${timeStr}`
		}
		previewImg.src = dataUrl
	})

	async function deliver(message) {
		if (!imageDataUrl || sending) return
		setSending(true)
		hintText.textContent = '正在送入 AI 对话…'
		try {
			await window.desktopEye.sendScreenshot({ imageBase64: imageDataUrl, message, mode: 'active' })
			showToast('截图已进入 AI 对话')
			hintText.textContent = '已送达'
			setTimeout(() => window.desktopEye.sendCancel(), 350)
		} catch (error) {
			hintText.textContent = '未送达，截图和输入已保留，可直接重试。'
			showToast('发送失败：' + (error?.message || '插件接线不可用'), 5000)
			setSending(false)
		}
	}

	// 发送（主动模式 — 需要输入消息）
	btnSend.addEventListener('click', () => {
		if (!imageDataUrl) return
		const userMessage = messageInput.value.trim()
		if (!userMessage) {
			// 没有输入时提示
			messageInput.style.borderColor = '#e74c3c'
			messageInput.placeholder = '请输入要对 AI 说的话，\n或者点击"仅分享"'
			setTimeout(() => { messageInput.style.borderColor = '#d4a017' }, 2000)
			return
		}
		deliver(userMessage)
	})

	// 直接发图也是主动视觉消息；旧 passive 只落 pending、不会进入 addUserReply，文案与行为相反。
	btnPassive.addEventListener('click', () => {
		deliver('')
	})

	// 取消
	btnCancel.addEventListener('click', () => {
		window.desktopEye.sendCancel()
	})

	btnClose.addEventListener('click', () => {
		window.desktopEye.sendCancel()
	})

	// 快捷键
	document.addEventListener('keydown', (e) => {
		if (e.key === 'Escape') {
			window.desktopEye.sendCancel()
		}
		// Enter 发送（Shift+Enter 换行）
		if (e.key === 'Enter' && !e.shiftKey && document.activeElement === messageInput) {
			e.preventDefault()
			btnSend.click()
		}
		// Ctrl+Enter 也可以发送
		if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
			e.preventDefault()
			btnSend.click()
		}
	})

	// 语音输入(凛倾 0722 完整链):🎤开录→⏹停+转文字(主进程直连本机 STT 服务,降噪+拾音)
	// →填输入框→用户点「发送 ✦」走既有截图注入链(/api/eye/inject)
	if (btnMic && window.desktopEye.sttRecord) {
		let rec = false
		btnMic.addEventListener('click', () => window.desktopEye.sttRecord(rec ? 'stop' : 'start'))
		window.desktopEye.onSttResult((r) => {
			if (r.phase === 'starting') { showToast(r.note || 'STT 服务启动中…', 60000) }
			else if (r.phase === 'recording') { rec = true; btnMic.textContent = '⏹'; showToast('录音中…再点⏹结束', 60000) }
			else if (r.phase === 'transcribing') { rec = false; btnMic.textContent = '…'; showToast('转文字中…', 60000) }
			else if (r.phase === 'done') {
				btnMic.textContent = '🎤'
				if (r.text) { messageInput.value = (messageInput.value ? messageInput.value + ' ' : '') + r.text; showToast('已转文字,点「发送 ✦」') }
				else showToast('未识别到语音')
			}
			else if (r.phase === 'error') { rec = false; btnMic.textContent = '🎤'; showToast('语音失败: ' + (r.error || '')) }
		})
	} else if (btnMic) { btnMic.style.display = 'none' }

	// 自动聚焦输入框
	setTimeout(() => messageInput.focus(), 100)
})()
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>always accompany · 桌宠菜单</title>
	<!--
		桌宠【悬浮设置菜单窗】(凛倾 2026-07-12"还可以打开悬浮窗直接设置""可以参考这个游戏"——萝莉斯桌宠标签条形态):
		角色脚下标签条 对话/形象/设置/截图/系统 + 二级面板。触发=角色双击 或 右键菜单「悬浮菜单」。
		窗口 focusable(对话输入要键盘焦点),blur 即通知主进程关闭(游戏同款轻量退场)。
		所有动作经 preload petMenuAction 单通道 → 主进程映射【既有链】:
		  chat-send→pet-message / set-model→setPetSetting / set-scale→PET_GROUP 重排+petHeight 持久化 /
		  set-opacity→bubbleOpacity / toggle-passthrough→applyPetPassthrough / crop→startCropCapture /
		  autoshot→autoCapture.autoCaptureAndSend / hide/close/open-web。不造新后端。
		风格与 pet-bubble 同源(flat 琥珀米白,CSS 变量同名)。
	-->
	<style>
		:root {
			--bubble-alpha: 0.95;
			--bubble-bg: rgba(255, 253, 248, var(--bubble-alpha));
			--bubble-fg: #302a22;
			--bubble-border: rgba(181, 139, 58, 0.28);
			--bubble-name-color: #a46f08;
			--accent: #e8ad24;
			--accent-deep: #bb7a08;
			--muted: #83796c;
			--surface: rgba(255,255,255,.68);
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; font: 12px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif; }
		body { padding: 4px; }
		#wrap { display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(145deg,rgba(255,255,255,.97),var(--bubble-bg)); border: 1px solid var(--bubble-border); border-radius: 16px; box-shadow: 0 10px 32px rgba(46,35,18,.22), 0 2px 7px rgba(46,35,18,.09); backdrop-filter: blur(18px) saturate(1.08); }
		#menubar { display: flex; align-items: center; gap: 2px; min-height: 38px; padding: 5px 6px 4px; background: rgba(255,255,255,.3); border-bottom: 1px solid rgba(117,92,48,.09); }
		#menubar .tab { position: relative; flex: 1; text-align: center; padding: 6px 2px; border-radius: 8px; cursor: pointer; color: #696158; white-space: nowrap; transition: color .16s ease, background .16s ease, transform .16s ease; }
		#menubar .tab:hover { color: var(--accent-deep); background: rgba(232,173,36,.08); }
		#menubar .tab:active { transform: translateY(1px); }
		#menubar .tab.active { color: #7e5200; background: rgba(232,173,36,.14); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(213,145,13,.08); }
		#menubar .tab.active::after { content:""; position:absolute; left:30%; right:30%; bottom:2px; height:2px; border-radius:2px; background:var(--accent); }
		#menu-close { flex: 0 0 28px; width: 28px; height: 28px; margin-left: 2px; padding: 0; border-radius: 50%; font-size: 14px; color: #8d8378; }
		#menu-close:hover { color:#7d381f; background:rgba(187,72,29,.1); }
		.panel { display: none; padding: 10px 11px 11px; color: var(--bubble-fg); }
		.panel.show { display: block; }
		.row { display: flex; align-items: center; gap: 7px; margin: 6px 0; }
		label { min-width: 58px; color: var(--bubble-name-color); font-weight: 700; font-size: 12px; }
		input[type=range] { flex: 1; accent-color: #dfa62a; }
		input[type=text] { flex: 1; min-width: 0; border: 1px solid rgba(181,139,58,.26); border-radius: 9px; padding: 6px 9px; font: inherit; background: var(--surface); outline: none; color: var(--bubble-fg); }
		input[type=text]:focus { border-color: rgba(207,139,9,.62); box-shadow: 0 0 0 3px rgba(232,173,36,.1); }
		select { flex: 1; border: 1px solid rgba(181,139,58,.26); border-radius: 9px; padding: 5px 7px; font: inherit; font-size: 12px; background: var(--surface); color: var(--bubble-fg); outline: none; }
		button { border: none; border-radius: 9px; padding: 5px 11px; font: inherit; font-size: 12px; background: linear-gradient(145deg,#efbd43,#dc9417); color: #4b3308; font-weight: 700; cursor: pointer; transition: transform .13s ease, filter .13s ease, background .13s ease; }
		button:hover { filter: brightness(1.035); }
		button:active { transform: translateY(1px); }
		button.ghost { background: rgba(126,103,65,.075); color: var(--bubble-fg); font-weight: 500; }
		button.ghost:hover { background: rgba(232,173,36,.13); }
		button.ghost.on { background: rgba(232,173,36,.2); color:#805600; font-weight: 700; }
		.item { padding: 8px 9px; border-radius: 9px; cursor: pointer; color:#554d43; transition:background .15s ease,color .15s ease; }
		.item:hover { background: rgba(232,173,36,.1); color:#805600; }
		.hint { font-size: 10px; color: var(--muted); margin-top: 5px; }
		#model-list { display: flex; flex-wrap: wrap; gap: 5px; max-height: 96px; overflow-y: auto; }
		.val { min-width: 44px; text-align: right; font-size: 12px; color: var(--bubble-name-color); }
		#p-chat { padding-top: 9px; }
		#chat-replies { display:none; max-height:136px; overflow-y:auto; margin:0 1px 8px; padding:3px; white-space:pre-wrap; word-break:break-word; scrollbar-width:thin; }
		#chat-replies > div { margin:0 0 6px auto; padding:7px 9px; border-radius:10px 10px 3px 10px; background:rgba(232,173,36,.10); color:#51483e; box-shadow:inset 0 0 0 1px rgba(181,139,58,.08); }
		#p-chat .composer { gap:4px; margin:0; padding:4px; border:1px solid rgba(181,139,58,.25); border-radius:12px; background:rgba(255,255,255,.72); box-shadow:0 3px 12px rgba(69,50,19,.055); }
		#chat-input { height:31px; padding:4px 7px; border:0; background:transparent; box-shadow:none; }
		#chat-input:focus { border:0; box-shadow:none; }
		#chat-input::placeholder { color:#999087; }
		#chat-mic { display:grid; place-items:center; flex:0 0 31px; width:31px; height:31px; padding:0; border-radius:9px; color:#756650; background:rgba(232,173,36,.10); }
		#chat-mic svg { width:15px; height:15px; }
		#chat-mic.on { color:#fff8ec; background:linear-gradient(145deg,#d86643,#b8442d); box-shadow:0 0 0 3px rgba(196,69,40,.11); }
		#chat-send { flex:0 0 48px; height:31px; padding:0 9px; border-radius:9px; box-shadow:0 3px 8px rgba(190,121,9,.16); }
		#chat-hint { display:flex; align-items:center; gap:5px; min-height:16px; margin:5px 3px 0; }
		#chat-hint::before { content:""; flex:0 0 5px; width:5px; height:5px; border-radius:50%; background:rgba(164,111,8,.42); }
	</style>
</head>
<body>
	<div id="wrap">
		<div id="menubar">
			<div class="tab active" data-p="p-chat">对话</div>
			<div class="tab" data-p="p-look">形象</div>
			<div class="tab" data-p="p-set">设置</div>
			<div class="tab" data-p="p-shot">截图</div>
			<div class="tab" data-p="p-sys">系统</div>
			<button class="ghost" id="menu-close" title="关闭悬浮对话" style="margin-left:auto">✕</button>
		</div>
		<div class="panel show" id="p-chat">
			<!-- T9(凛倾 0722):AI 回应直接显示在本对话框(与气泡同源),不再只指望下方气泡 -->
			<div id="chat-replies"></div>
			<div class="row composer"><input type="text" id="chat-input" placeholder="问问贝露…" maxlength="500"><button class="ghost" id="chat-mic" aria-label="快速语音" title="快速语音：点一次开始，再点一次结束并自动发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v4M9 21h6"></path></svg></button><button id="chat-send">发送</button></div>
			<div class="hint" id="chat-hint">回应会显示在这里和下方气泡</div>
		</div>
		<div class="panel" id="p-look">
			<div class="row" style="align-items:flex-start"><label>形象</label><div id="model-list"></div></div>
			<div class="hint">点击即切换(与网页设置中心同源)</div>
		</div>
		<div class="panel" id="p-set">
			<div class="row"><label>大小比例</label><input type="range" id="scale" min="50" max="186" value="100"><span class="val" id="scale-val">100%</span><button class="ghost" id="size-reset">复位</button></div>
			<div class="row"><label>气泡透明</label><input type="range" id="opacity" min="20" max="100" value="95"><span class="val" id="opacity-val">95%</span></div>
			<!-- T8(凛倾 0722"[系统tab]改成[右键完整菜单].而不是状态显示"):停留/表情/动态=完整操作项,选项数据主进程 menu 字段单源 -->
			<div class="row"><label>气泡停留</label><select id="dwell"></select></div>
			<div class="row"><label>待机表情</label><select id="expr"></select></div>
			<div class="row"><label>动态预设</label><select id="dyn"></select></div>
			<div class="row"><label>游戏穿透</label><button class="ghost" id="passthrough">关</button><span class="hint">开启后角色上右键可切回</span></div>
		</div>
		<div class="panel" id="p-shot">
			<div class="item" id="crop">📷 框选截图 → 给 AI 看 (Alt+Shift+S)</div>
			<div class="item" id="autoshot">👁 自截图一张(全屏·带去重/时间)</div>
		</div>
		<div class="panel" id="p-sys">
			<div class="item" id="hide">🙈 隐藏桌宠(托盘 ✦ 可重新打开)</div>
			<div class="item" id="open-web">🌐 打开 beilu 网页设置中心</div>
			<div class="item" id="close-pet">⛔ 关闭桌宠(网页设置中心可重开)</div>
		</div>
	</div>
	<script>
		const $ = (id) => document.getElementById(id);
		const act = (action, value) => window.desktopEye && window.desktopEye.petMenuAction(action, value);
		// 标签切换 + 面板高度变化上报(主进程按内容收缩窗高)
		const tabs = document.querySelectorAll('#menubar .tab');
		function _reportH() { requestAnimationFrame(() => act('resize', document.getElementById('wrap').scrollHeight + 8)); }
		tabs.forEach((t) => { t.onclick = () => {
			tabs.forEach((x) => x.classList.remove('active'));
			document.querySelectorAll('.panel').forEach((p) => p.classList.remove('show'));
			t.classList.add('active');
			$(t.dataset.p).classList.add('show');
			_reportH();
		}; });
		// 常驻关闭出口(凛倾 0722"真实常驻":blur 自关已删,✕/右键再点/快捷键=三个显式出口)
		$('menu-close').onclick = () => act('dismiss');
		// T9:AI 回应进对话框(语音/触碰/截图/输入触发的回应全经主进程 _showOrbBanner 同源推来)
		if (window.desktopEye && window.desktopEye.onPetChatReply) {
			window.desktopEye.onPetChatReply((text) => {
				const box = $('chat-replies');
				if (!box || !text) return;
				box.style.display = '';
				const item = document.createElement('div');
				item.textContent = text;
				item.style.marginBottom = '6px';
				box.appendChild(item);
				while (box.children.length > 8) box.removeChild(box.firstChild);
				box.scrollTop = box.scrollHeight;
				_reportH();
			});
		}
		// 对话:走 pet-message 既有链(与触碰热区 send 同通道)
		function _send() {
			const t = $('chat-input').value.trim();
			if (!t) return;
			act('chat-send', t);
			$('chat-input').value = '';
			$('chat-hint').textContent = '已发送,回应稍后出现在气泡';
		}
		$('chat-send').onclick = _send;
		$('chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') _send(); e.stopPropagation(); });
		// 快速语音发送：🎤开录→⏹停→主进程转文字→自动发进 pet-message；与全局快捷键共用状态机。
		(() => {
			const mic = $('chat-mic');
			if (!mic || !window.desktopEye || !window.desktopEye.quickVoiceToggle) return;
			const MIC_IDLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v4M9 21h6"></path></svg>';
			const MIC_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';
			const MIC_BUSY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8" opacity=".2"></circle><path d="M20 12a8 8 0 0 0-8-8"></path></svg>';
			mic.onclick = () => window.desktopEye.quickVoiceToggle();
			window.desktopEye.onQuickVoiceStatus((r) => {
				const hint = $('chat-hint');
				if (r.phase === 'starting') { mic.innerHTML = MIC_BUSY; if (hint) hint.textContent = r.note || 'STT 服务启动中…'; }
				else if (r.phase === 'recording') { mic.innerHTML = MIC_STOP; mic.classList.add('on'); if (hint) hint.textContent = '录音中…再点一次结束并发送 · ' + (r.device || '默认设备'); }
				else if (r.phase === 'transcribing') { mic.innerHTML = MIC_BUSY; if (hint) hint.textContent = r.note || '转文字中…'; }
				else if (r.phase === 'sending') { mic.innerHTML = MIC_BUSY; if (hint) hint.textContent = r.note || '正在发送…'; }
				else if (r.phase === 'sent') { mic.innerHTML = MIC_IDLE; mic.classList.remove('on'); if (hint) hint.textContent = r.text ? '已自动发送：' + r.text : '已自动发送'; }
				else if (r.phase === 'error') { mic.innerHTML = MIC_IDLE; mic.classList.remove('on'); if (hint) hint.textContent = '语音失败：' + (r.error || ''); }
				else if (r.phase === 'idle') { mic.innerHTML = MIC_IDLE; mic.classList.remove('on'); }
			});
		})();
		// 草稿实时上报主进程(凛倾 2026-07-13"3做":blur 自关不再丢字,重开经 pet-menu-init.chatDraft 恢复)
		$('chat-input').addEventListener('input', () => act('draft', $('chat-input').value));
		// 设置控件
		$('scale').addEventListener('input', () => { $('scale-val').textContent = $('scale').value + '%'; act('set-scale', Number($('scale').value)); });
		$('opacity').addEventListener('input', () => { $('opacity-val').textContent = $('opacity').value + '%'; act('set-opacity', Number($('opacity').value) / 100); });
		$('passthrough').onclick = () => act('toggle-passthrough');
		$('size-reset').onclick = () => act('size-reset');
		$('crop').onclick = () => act('crop');
		$('autoshot').onclick = () => { act('autoshot'); };
		$('hide').onclick = () => act('hide');
		$('open-web').onclick = () => act('open-web');
		$('close-pet').onclick = () => act('close-pet');
		// Esc 关菜单
		window.addEventListener('keydown', (e) => { if (e.key === 'Escape') act('dismiss'); });
		// 初始化(主进程推当前状态:形象列表/当前值)
		if (window.desktopEye && window.desktopEye.onPetMenuInit) {
			window.desktopEye.onPetMenuInit((cfg) => {
				if (!cfg) return;
				if (Array.isArray(cfg.models)) {
					const box = $('model-list');
					box.innerHTML = '';
					for (const name of cfg.models) {
						const b = document.createElement('button');
						b.className = 'ghost' + (name === cfg.currentModel ? ' on' : '');
						b.textContent = name;
						b.onclick = () => { act('set-model', name); box.querySelectorAll('button').forEach((x) => x.classList.remove('on')); b.classList.add('on'); };
						box.appendChild(b);
					}
				}
				// D1 分叉修(2026-07-13):滑条值域=主进程按真实限值(caps 接管的 PET_GROUP.min/maxH)换算下发,HTML 50~186 只是离线初值
				if (Number(cfg.scaleMinPct) > 0) $('scale').min = Math.round(cfg.scaleMinPct);
				if (Number(cfg.scaleMaxPct) > 0) $('scale').max = Math.round(cfg.scaleMaxPct);
				// D3 分叉修:输入限值=caps.hitLimits.sayMaxChars 单源(HTML maxlength=500 只是离线初值)
				if (Number(cfg.sayMaxChars) > 0) $('chat-input').maxLength = Math.round(cfg.sayMaxChars);
				// B1:截图项文案随真实快捷键
				if (typeof cfg.hotkey === 'string' && cfg.hotkey) $('crop').textContent = '📷 框选截图 → 给 AI 看 (' + cfg.hotkey + ')';
				// T8:停留/表情/动态选择器(选项数据=主进程 _menuOptionData 单源,与托盘菜单同源零副本)
				if (cfg.menu) {
					const fill = (id, opts, cur, actName) => {
						const sel = $(id); if (!sel) return;
						sel.innerHTML = '';
						for (const [label, v] of opts) {
							const o = document.createElement('option');
							o.value = String(v); o.textContent = label;
							if (String(v) === String(cur)) o.selected = true;
							sel.appendChild(o);
						}
						sel.onchange = () => act(actName, id === 'dwell' ? Number(sel.value) : sel.value);
					};
					if (Array.isArray(cfg.menu.dwellOptions)) fill('dwell', cfg.menu.dwellOptions, cfg.menu.curDwell, 'set-dwell');
					if (Array.isArray(cfg.menu.exprOptions)) fill('expr', cfg.menu.exprOptions, cfg.menu.curExpr, 'set-expr');
					if (Array.isArray(cfg.menu.dynKeys)) fill('dyn', cfg.menu.dynKeys.map((k) => [k || '标准', k]), '', 'set-dyn');
				}
				if (typeof cfg.scalePercent === 'number') { $('scale').value = Math.round(cfg.scalePercent); $('scale-val').textContent = Math.round(cfg.scalePercent) + '%'; }
				if (typeof cfg.bubbleOpacity === 'number') { const v = Math.round(cfg.bubbleOpacity * 100); $('opacity').value = v; $('opacity-val').textContent = v + '%'; }
				$('passthrough').textContent = cfg.passthrough ? '开' : '关';
				$('passthrough').classList.toggle('on', !!cfg.passthrough);
				if (typeof cfg.chatDraft === 'string' && cfg.chatDraft && !$('chat-input').value) $('chat-input').value = cfg.chatDraft; // 恢复上次未发送草稿
				$('chat-mic').title = cfg.quickVoiceHotkey
					? '快速语音：' + cfg.quickVoiceHotkey + '（按一次开始，再按一次结束并自动发送）'
					: '快速语音：点一次开始，再点一次结束并自动发送（全局快捷键未启用）';
				if (cfg.quickVoicePhase === 'recording') { $('chat-mic').innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>'; $('chat-mic').classList.add('on'); $('chat-hint').textContent = '录音中…再点一次结束并发送'; }
				_reportH();
			});
		}
		_reportH();
	</script>
</body>
</html>
